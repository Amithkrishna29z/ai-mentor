name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: ai-mentor-linux
            path: target/release/ai-mentor
          - os: windows-latest
            artifact: ai-mentor-windows
            path: target/release/ai-mentor.exe

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # eframe needs X11/Wayland and GL development headers on Linux runners.
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          # Runner images ship third-party apt repos (Microsoft, Chrome) that
          # intermittently 403 and fail the whole update; none are needed here.
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list \
                     /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libwayland-dev libxkbcommon-dev pkg-config

      - name: Build
        run: cargo build --release

      - name: Test
        run: cargo test --release

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
