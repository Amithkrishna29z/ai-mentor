name: release

on:
  push:
    tags: ["v*"]
  # Lets you dry-run the packaging without publishing anything.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: package ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64
          - os: windows-latest
            label: windows-x86_64

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # eframe needs X11/Wayland and GL development headers on Linux runners.
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libwayland-dev libxkbcommon-dev pkg-config

      - name: Build
        run: cargo build --release

      - name: Test
        run: cargo test --release

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p staging dist
          cp target/release/ai-mentor README.md staging/
          tar -czf "dist/ai-mentor-${{ github.ref_name }}-${{ matrix.label }}.tar.gz" -C staging .

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force staging, dist | Out-Null
          Copy-Item target\release\ai-mentor.exe, README.md staging\
          Compress-Archive -Path staging\* -DestinationPath "dist\ai-mentor-${{ github.ref_name }}-${{ matrix.label }}.zip"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ai-mentor-${{ matrix.label }}
          path: dist/*

  publish:
    name: publish release
    needs: package
    runs-on: ubuntu-latest
    # Only a tag push publishes; a manual run stops after packaging.
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --title "AI Mentor ${{ github.ref_name }}" \
            --generate-notes
